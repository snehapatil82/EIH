###############################################################################
# Render Blueprint — Engineering Intelligence Hub
#
# This file describes all services for one-click deploy on Render.
# Push this repo to GitHub and connect it on https://dashboard.render.com
###############################################################################

services:
  # ─── Backend: FastAPI Python service ───────────────────────────────────
  - type: web
    name: eih-backend
    runtime: python
    region: oregon
    plan: free            # change to "starter" for always-on
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        sync: false       # set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false       # set to your frontend URL after deploy
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ─── Frontend: Vite React static site ─────────────────────────────────
  - type: web
    name: eih-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false       # set to https://eih-backend.onrender.com/api/v1
