###############################################################################
# Render Blueprint — Engineering Intelligence Hub Backend
#
# This file describes the backend FastAPI service for one-click deploy on Render.
# The frontend is hosted on Vercel.
###############################################################################

services:
  # ─── Backend: FastAPI Python service ───────────────────────────────────
  - type: web
    name: eih-backend
    runtime: python
    region: oregon
    plan: free            # change to "starter" for always-on
    rootDir: backend
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: mock       # change to "openai" or "groq" once keys are set
      - key: OPENAI_API_KEY
        sync: false       # set manually in Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.8"
